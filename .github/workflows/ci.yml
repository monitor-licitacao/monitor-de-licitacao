name: CI (Quality)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configurar Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm ci
        env:
          HUSKY: 0

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      - name: Testes
        run: npm test
