name: CI (Tests)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de Tipos / Linter
        run: npm run lint

      - name: Testes (authz, logout, mural, amplitude)
        run: npm test

      - name: Validação de Segurança (IDOR + Auth)
        run: |
          JWT_SECRET="ci-test-jwt-secret-minimum-32-chars-long" PORT=3001 npm run dev &
          SERVER_PID=$!
          sleep 5
          API_URL=http://localhost:3001 bash scripts/nightly-security-check.sh
          kill $SERVER_PID || true
