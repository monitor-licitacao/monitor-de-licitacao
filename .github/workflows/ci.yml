name: CI (Tests)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CERT_ENCRYPTION_KEY: ${{ secrets.CERT_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de Tipos / Linter
        run: npm run lint

      - name: Testes (authz, logout, mural, amplitude)
        run: npm test

      - name: Validação de Segurança (IDOR + Auth)
        run: |
          set -euo pipefail
          JWT_SECRET="ci-test-jwt-secret-minimum-32-chars-long" PORT=3001 npm run dev &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          HEALTHY=false
          for i in {1..30}; do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/health || true)" = "200" ]; then
              HEALTHY=true
              break
            fi
            sleep 1
          done
          if [ "$HEALTHY" != "true" ]; then
            echo "Server did not become healthy within 30 seconds." >&2
            exit 1
          fi
          API_URL=http://localhost:3001 bash scripts/nightly-security-check.sh
