name: Nightly Security Validation (IDOR + Auth)

on:
  schedule:
    # Dispara diariamente às 03:00 UTC (00:00 BRT)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL alvo para teste (deixe vazio para rodar contra instância local)'
        required: false
        default: ''

jobs:
  security-validation:
    name: Validação Noturna de Segurança (IDOR + Auth)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de Tipos / Linter
        run: npm run lint

      - name: Suíte de testes unitários e de integração
        run: npm test

      - name: Executar Nightly Security Validation (IDOR + Auth)
        run: |
          TARGET="${{ github.event.inputs.target_url }}"
          if [ -n "$TARGET" ]; then
            echo "Executando validação contra target remoto: $TARGET"
            API_URL="$TARGET" bash scripts/nightly-security-check.sh
          else
            echo "Iniciando servidor local para validação noturna..."
            JWT_SECRET="nightly-security-jwt-secret-min-32-chars" PORT=3001 npm run dev &
            SERVER_PID=$!
            sleep 5
            API_URL=http://localhost:3001 bash scripts/nightly-security-check.sh
            kill $SERVER_PID || true
          fi
